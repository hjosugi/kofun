name: Synchronize delivery Project

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: Apply idempotent changes to the Kofun Delivery Roadmap Project
        required: true
        default: false
        type: boolean

# Snapshot generation and Pages publishing stay in docs-hourly.yml. Keeping this
# workflow manual and read-only for git prevents two workflows from pushing main.
permissions:
  contents: read
  issues: read

concurrency:
  group: kofun-project-roadmap
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Test Project reconciliation logic
        run: node --test site/setup-project.test.mjs
      - name: Plan or apply Project synchronization
        env:
          # GITHUB_TOKEN cannot access Projects. Configure PROJECTS_TOKEN as a
          # classic PAT with project and repo scopes before choosing apply.
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN || github.token }}
          KOFUN_PROJECTS_TOKEN_CONFIGURED: ${{ secrets.PROJECTS_TOKEN != '' }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_APPLY: ${{ inputs.apply }}
        run: |
          apply=false
          if [ "$EVENT_NAME" = "schedule" ] &&
             [ "$KOFUN_PROJECTS_TOKEN_CONFIGURED" = "true" ]
          then
            apply=true
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] &&
             [ "$REQUESTED_APPLY" = "true" ]
          then
            apply=true
          fi
          if [ "$apply" = "true" ]
          then
            node site/setup-project.mjs --apply
          else
            node site/setup-project.mjs
          fi
      - name: Record safety boundary
        if: always()
        run: |
          {
            echo "### Project synchronization safety"
            echo
            echo "- Repository: \`hjosugi/kofun\`"
            echo "- Project: \`Kofun Delivery Roadmap\`"
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- Manual apply requested: \`${{ inputs.apply || false }}\`"
            echo "- PROJECTS_TOKEN configured: \`${{ secrets.PROJECTS_TOKEN != '' }}\`"
            echo "- This workflow never commits or pushes git changes."
            echo "- Snapshot generation and Pages publishing use the existing hourly docs flow."
          } >> "$GITHUB_STEP_SUMMARY"
